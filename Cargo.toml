[package]
name = "vpn-client"
version = "0.3.1"
edition = "2021"
rust-version = "1.78"
description = "Composable async proxy client for Windows, backed by sing-box"
license = "MIT"

[lib]
name = "vpn_client"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["process", "fs", "net", "time", "sync", "macros", "rt-multi-thread"] }
url = "2"
uuid = { version = "1", features = ["v4", "v6", "serde", "rng", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "basic"
path = "examples/basic.rs"
